[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "local-ollama-coding-agent"
version = "0.1.0"
description = "A local-first, repository-confined coding agent powered only by Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bharath Haleshappa" }]
dependencies = []

[project.scripts]
local-coder = "local_coder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_coder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
